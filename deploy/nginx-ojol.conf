# Konfigurasi Nginx Reverse Proxy untuk Kampung Ojol (ojol.jnck.pl)
# Pasang file ini di /etc/nginx/sites-available/ojol.jnck.pl
# lalu buat symlink: sudo ln -sf /etc/nginx/sites-available/ojol.jnck.pl /etc/nginx/sites-enabled/
# dan reload nginx: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ojol.jnck.pl;

    # Endpoint ACME challenge untuk pancingan verifikasi awal Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Reverse proxy ke Kampung Ojol Web Backend (Port 6080)
    location / {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Dukungan Real IP Cloudflare Proxied & Origin Direct
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer & Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 50M;
    }
}

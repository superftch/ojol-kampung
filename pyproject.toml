[project]
name = "ojol-automation"
version = "0.1.0"
description = "Automation Ojol multi-account melalui adapter HTTP."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "defusedxml>=0.7.1,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.4",
    "ty==0.0.109",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:.*starlette.testclient.*",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".local"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # PEP 8 errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "UP",   # Modern Python syntax
    "B",    # Bugbear
    "SIM",  # Simplification
    "C4",   # Comprehensions
    "RUF",  # Ruff-specific rules
    "S",    # Security
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

name: kampung-ojol
services:
  warp:
    build:
      context: .
      target: mesh
    image: kampung-ojol-mesh:local
    init: true
    restart: unless-stopped
    ports:
      - "${OJOL_BIND_IP:-0.0.0.0}:${OJOL_PORT:-6080}:6080"
    environment:
      SRCNAT_ENABLED: "true"
    secrets:
      - mesh_node_token
    volumes:
      - warp-state:/var/lib/cloudflare-warp
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    healthcheck:
      test: [CMD-SHELL, "warp-cli --accept-tos status | grep -q 'Connected'"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
  app:
    build:
      context: .
      target: runtime
    image: kampung-ojol:local
    init: true
    restart: unless-stopped
    network_mode: service:warp
    depends_on:
      warp:
        condition: service_healthy
    volumes:
      - state:/data
    secrets:
      - ojol_env
      - cloudflared_token
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 60s
  worker:
    build:
      context: .
      target: runtime
    image: kampung-ojol:local
    init: true
    restart: unless-stopped
    network_mode: service:warp
    depends_on:
      warp:
        condition: service_healthy
    command: ["python", "-m", "ojol.worker_service"]
    volumes:
      - state:/data
    secrets:
      - ojol_env
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 60s

volumes:
  state:
  warp-state:
secrets:
  ojol_env:
    file: .env
  cloudflared_token:
    file: .secrets/cloudflared-token
  mesh_node_token:
    file: .secrets/cloudflare-mesh-token

name: kampung-ojol-dev
services:
  app:
    build:
      context: .
      target: runtime
    image: kampung-ojol:dev
    init: true
    ports:
      - "127.0.0.1:6081:6080"
    environment:
      OJOL_ENV: local
      OJOL_TUNNEL_ENABLED: "false"
      OJOL_LOGIN_PUBLIC_URL: http://127.0.0.1:6081
    volumes:
      - dev-state:/data
    secrets:
      - ojol_env
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 60s
volumes:
  dev-state:
secrets:
  ojol_env:
    file: .env.local
